[main]
#LDAP Realm

cevaLdapRealm = org.apache.shiro.realm.ldap.DefaultLdapRealm
cevaLdapRealm.userDnTemplate = {0}
cevaLdapRealm.contextFactory.url = ldap://ldap-gdc.logistics.corp:3268

ldapRealm = org.apache.shiro.realm.ldap.DefaultLdapRealm
ldapRealm.userDnTemplate = {0}
ldapRealm.contextFactory.url = ldap://ad.fifthlayer.net:3268

#Database Realm
dataSource = org.apache.shiro.jndi.JndiObjectFactory   
dataSource.requiredType = javax.sql.DataSource  
dataSource.resourceName = java:/comp/env/aafDataSource

jdbcRealm = org.apache.shiro.realm.jdbc.JdbcRealm
jdbcRealm.dataSource = $dataSource

jdbcRealm.authenticationQuery = SELECT password FROM aaf_user WHERE user_type='E' AND  LOWER(user_principal) = LOWER(?)
jdbcRealm.permissionsLookupEnabled = true 

jdbcRealm.userRolesQuery = SELECT r.role_name FROM aaf_role r join aaf_user_role ur on r.role_id = ur.role_id join aaf_user u on u.user_id=ur.user_id  WHERE LOWER(u.user_principal) = LOWER(?) 
jdbcRealm.permissionsQuery = SELECT concat(domain,':',action,':',instance) FROM aaf_permission p join aaf_role_permission rp on rp.permission_id = p.permission_id join aaf_role r on r.role_id = rp.role_id WHERE role_name = ?

passwordMatcher = org.apache.shiro.authc.credential.PasswordMatcher
passwordService = org.apache.shiro.authc.credential.DefaultPasswordService
passwordMatcher.passwordService = $passwordService 

jdbcRealm.credentialsMatcher = $passwordMatcher

securityManager.realms = $jdbcRealm, $cevaLdapRealm

#aafSessionListener = com.ceva.security.aaf.session.AAFSessionListener
#securityManager.sessionManager.sessionListeners = $aafSessionListener

[urls]
/rest/api/v1/todos/** = authcBasic
/rest/api/v1/users/** = authcBasic
/rest/api/v1/roles/** = authcBasic
/rest/api/v1/permissions/** = authcBasic
/rest/api/v1/health = anon
/rest/api/v1/buildInfo = anon