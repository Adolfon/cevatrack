#***************** Java Util Logging Starts ***********************************
handlers = 1catalina.java.util.logging.FileHandler, 2localhost.org.apache.juli.AsyncFileHandler, 3manager.org.apache.juli.AsyncFileHandler, 4host-manager.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler
.handlers = 1catalina.java.util.logging.FileHandler, java.util.logging.ConsoleHandler

1catalina.java.util.logging.FileHandler.level = FINE
1catalina.java.util.logging.FileHandler.pattern = ${catalina.base}/logs/cevatrack.log
#The size limit is in bytes (Ex: 50000000 = 50MB)
1catalina.java.util.logging.FileHandler.limit =7930000
#The default is 10000 (which produces a maximum of 10,000 log files)
1catalina.java.util.logging.FileHandler.count = 50
1catalina.java.util.logging.FileHandler.append = true
java.util.logging.ConsoleHandler.level = OFF
1catalina.java.util.logging.FileHandler.formatter =  java.util.logging.SimpleFormatter
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT - %4$s %2$s - %5$s %6$s%n
#***************** Java Util Logging Ends ***********************************

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].handlers = 2localhost.org.apache.juli.AsyncFileHandler

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/manager].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/manager].handlers = 3manager.org.apache.juli.AsyncFileHandler

org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/host-manager].level = INFO
org.apache.catalina.core.ContainerBase.[Catalina].[localhost].[/host-manager].handlers = 4host-manager.org.apache.juli.AsyncFileHandler


############################################################
# Log level by package/class
############################################################
com.ceva.cjf.base.web.ErrorReportManagedBean.level = WARNING
com.ceva.template.presentation.TodoController.level = SEVERE
com.ceva.security.aaf.service.AAFUserServiceImpl.level = FINE
org.apache.tomcat.websocket.server.WsRemoteEndpointImplServer.level = CONFIG
org.apache.shiro.authc.pam.ModularRealmAuthenticator.level = WARNING
com.ceva.cevatrack.rest.v1.impl.JohnsonAPI.level = FINE
com.ceva.cevatrack.rest.v1.impl.NikeAPI.level = FINE



.level= INFO

