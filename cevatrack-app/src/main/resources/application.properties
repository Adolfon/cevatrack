#Application 
app.name=Cevatrack

#Prefix for application version.
application.version.prefix=CEVATRACK V

#CJF Contact Us 
cjf.contactus.address=_SH_-GL-US-CJF@Cevalogistics.com
cjf.error.report.page=error-report.xhtml?faces-redirect=true
cjf.error.report.mail.subject=Error Report from {0}
cjf.error.report.mail.content=<html><body>Dear Admin,<br />The Following user experienced an error in application. Please find details below:<br />User ID:{0}<br />Name:{1}<br />Email:{2}<br />This is the description of Error: {3}<br />{4}<br />{5}<br />Thanks,<br />{6}</body></html>

#CJF Error Report page configuration properties for file upload
cjf.error.report.file.sizeLimit=100000
cjf.error.report.file.limit=3
cjf.error.report.file.acceptType=/(\\.|\\/)(gif|jpe?g|png)$/

#Location of uploaded files
file.path.location = /logs/file-upload/

#Maximum file that can be uploaded.
max.file.upload=100000

#previous password max
aaf.password.history.max=12

#pagination configurations
cjf.paginator.position=bottom
cjf.pagesize.values=10,25,50
cjf.initial.pagesize=10

#view expiry exception forward page
cjf.viewexpiry.redirect.page=/index.xhtml

#Expressions for user email and password.
aaf.email.format=([^.@]+)(\\.[^.@]+)*@([^.@]+\\.)+([^.@]+)
aaf.password.allowed.special.characters=@!\\(\\)\\-\\^\\*\\_\\+\\=\\:;\\.\\?/,#\\$%

#This is used to enable the tooltip on the login page
#aaf.login.show_login_tooltip=true

#User Sign Up Email Info
aaf.user.email.as.login=true
aaf.user.creation.cc.mail.address=
aaf.user.creation.template.images=create_user_image.png

#Property to set a default role upon user signup
aaf.user.default.roleName=Todo Management

#Property to set a default value for layout
user.default.menu.mode=layout-menu-horizontal

#Property to set a default value for theme
user.default.theme=cjf

#Property to set a default value for logo Link
logo.link.default.page=home.xhtml

#Property to display the corresponding page.
#login.page=login.xhtml
#change.password.page=change-password.xhtml

#Propery to access Matomo website. This is the same for all environments.
matomo.website=https://cjftemplate.matomo.cloud/

#Property yo show roles assigned to user in user maintainence screen.
aaf.userMaintenance.show.roles=false

#To expose any directory via file navigator. Separate them using ;
file.navigator.directories=tomee/logs

#property to set default application timeformat
default.timeformat=HH:mm:ss

#property to set default application dateformat
default.dateformat=MM/dd/yyyy