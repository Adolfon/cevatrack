<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="app-template.xhtml">
	<f:metadata>
	  
		<f:event listener="#{aAFSecurityBean.hasAnyPermissions}"
			type="preRenderView"></f:event>
		<f:attribute name="permission" value="#{CJFPermissionConstants.ADMIN_MANAGE_HEAP},#{CJFPermissionConstants.ADMIN_MANAGE_SERVING}" />

	</f:metadata>
	<ui:define name="title">
		<h:outputText value="#{lbl['admin.title']}" />
	</ui:define>

	<ui:define name="content">
		<ui:include src="/cjf-base/admin.xhtml"/>
	</ui:define>

</ui:composition>
