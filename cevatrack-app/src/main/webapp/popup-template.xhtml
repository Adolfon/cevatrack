<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:aaf="http://xmlns.jcp.org/jsf/composite/aaf"
	template="cjf-base/template.xhtml">

	<ui:define name="title">
		<title><h:outputText value="#{lbl['cjfPopupTemplate.title']}" /></title>
	</ui:define>

	<ui:define name="stylesheets">
		<h:outputStylesheet library="css" name="css/primefaces-override.css?#{buildInfoBean.buildTime}" />
		<h:outputStylesheet library="css" name="css/cjf-theme.css?#{buildInfoBean.buildTime}" />
		<h:outputStylesheet library="css" name="aaf/css/aaf.css?#{buildInfoBean.buildTime}" />
		<h:outputStylesheet library="css" name="css/aaf-override.css?#{buildInfoBean.buildTime}" />
		<h:outputStylesheet library="css" name="css/cjf-override.css?#{buildInfoBean.buildTime}" />
		<h:outputStylesheet library="css" name="css/app.css?#{buildInfoBean.buildTime}" />
	</ui:define>

	<ui:define name="custom-functions">
		<p:importConstants
			type="com.ceva.security.aaf.utils.AAFPermissionConstants"
			var="AAFPermissionConstants" />
		<p:importConstants
			type="com.ceva.template.util.CJFPermissionConstants"
			var="CJFPermissionConstants" />
	</ui:define>

	<ui:define name="cjf_template_sitelogo">
	
	</ui:define>

	<ui:define name="cjf_template_topRight">
		
	</ui:define>

	<ui:define name="cjf_template_leftAlignedMenu">
		
	</ui:define>

	<ui:define name="footer">
		<aaf:sessionmonitor id="sessionMonitor" />
		<ui:include src="cjf-extension/footer.xhtml" />
		<h:outputScript library="js" name="app-script-1.js?#{buildInfoBean.buildTime}" />
	</ui:define>

</ui:composition>
