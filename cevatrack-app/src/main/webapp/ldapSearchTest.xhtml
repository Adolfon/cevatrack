<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:cjf="http://xmlns.jcp.org/jsf/composite/cjf"
	xmlns:p="http://primefaces.org/ui" template="app-template.xhtml">
	<ui:define name="title">
		<title><h:outputText value="#{lbl['cjfTemplate.title']}" /></title>
	</ui:define>

	<ui:define name="content">
		<h:form id="frm_multi_ldapSearchtest">
			<h:panelGroup id="pg_1st_search">
				<p:panel id="panel_1stSearch">
					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-4 ui-grid-col-8">
						<p:outputLabel value="#{lbl['ldapSearch.firstUserPrinciple']}"></p:outputLabel> 
						<p:panelGrid columns="2"
							columnClasses="ui-grid-col-10 ui-grid-col-2">
							<p:inputText id="txt_1stUser_principle"
								value="#{ldapSearchTestController.firstUser.principalName}"></p:inputText>
							<cjf:ldapSearch id="cjf_1st_userSearch"
								selectionAction="#{ldapSearchTestController.select1stUserAction}"
								value="#{ldapSearchTestController.firstUserSelected}" />
						</p:panelGrid>
						<p:outputLabel value="#{lbl['ldapSearch.firstAccountantName']}"></p:outputLabel>
						<p:inputText id="txt_1stUser_accountName"
							value="#{ldapSearchTestController.firstUser.accountName}"></p:inputText>
						<p:outputLabel value="#{lbl['ldapSearch.firstDisplayName']}"></p:outputLabel>
						<p:inputText id="txt_1stUser_displayName"
							value="#{ldapSearchTestController.firstUser.displayName}"></p:inputText>
					</p:panelGrid>
				</p:panel>
			</h:panelGroup>
			<h:panelGroup id="pg_2nd_search">
				<p:panel id="panel_2stSearch">
					<p:panelGrid columns="2"
						columnClasses="ui-grid-col-4 ui-grid-col-8">
						<p:outputLabel value="#{lbl['ldapSearch.secondUserPrinciple']}"></p:outputLabel> 
						<p:panelGrid columns="2"
							columnClasses="ui-grid-col-10 ui-grid-col-2">
							<p:inputText id="txt_2stUser_principle"
								value="#{ldapSearchTestController.secondUser.principalName}"></p:inputText>
							<cjf:ldapSearch id="cjf_2st_userSearch"
								selectionAction="#{ldapSearchTestController.select2ndUserAction}"
								value="#{ldapSearchTestController.secondUserSelected}" />
						</p:panelGrid>
						<p:outputLabel value="#{lbl['ldapSearch.secondAccountantName']}"></p:outputLabel>
						<p:inputText id="txt_2stUser_accountName"
							value="#{ldapSearchTestController.secondUser.accountName}"></p:inputText>
						<p:outputLabel value="#{lbl['ldapSearch.secondDisplayName']}"></p:outputLabel>
						<p:inputText id="txt_2stUser_displayName"
							value="#{ldapSearchTestController.secondUser.displayName}"></p:inputText>
					</p:panelGrid>
				</p:panel>
			</h:panelGroup>
			<p:panelGrid columns="2" columnClasses="ui-grid-col-4 ui-grid-col-8">
				<h:panelGroup />
				<p:panelGrid columns="2" columnClasses="ui-grid-col-6">
					<p:commandButton ajax="true" value="#{lbl['gen.btn.save']}" actionListener="#{ldapSearchTestController.saveUsers}" process="@form" update="@form" ></p:commandButton>
					<p:commandButton ajax="true" value="#{lbl['gen.btn.reset']}" actionListener="#{ldapSearchTestController.resetUsers}" process="@form" update="@form" ></p:commandButton>
					
				</p:panelGrid>
			</p:panelGrid>
		</h:form>
	</ui:define>
</ui:composition>
