<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="app-template.xhtml">
		
		<ui:define name="content">
		    <h2>Sorry, there was an error in the application, please contact support if the problem persist</h2>
		
		    <h4>Error message:</h4>
		    #{requestScope['error-message']}
		
			<!-- 
		    <h4>Stack trace for the error</h4>
		    <ul>
		    <ui:repeat value="#{requestScope['error-stack']}" var="stack">
		        <li>#{stack.className} - #{stack.methodName} - #{stack.fileName} (#{stack.lineNumber})</li>
		    </ui:repeat>
		    </ul>  -->
		<br></br>
		<div style = "padding-top:3%;">
			<h:link  value=" Go Home" outcome="home"/>
		</div>
		</ui:define>
		
		<ui:define name="footer">
			<ui:include src="cjf-extension/footer.xhtml" />
		</ui:define>	
</ui:composition>
