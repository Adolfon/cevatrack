<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="app-template.xhtml">
		
		<ui:define name="content">
		    <h2>
		    	<h:outputText value="Sorry, there was an error in the application, please contact support if the problem persist" rendered = "#{empty error_msg}"/>		    	
		    </h2>
	    	<p>
	    		<h:outputText value="Error message: #{error_msg}" rendered = "#{not empty error_msg}"/>
	    	</p>	    	
			<br></br>
			<div style = "padding-top:3%;">
				<h:link  value=" Go Home" outcome="/home.xhtml"/>
			</div>
		</ui:define>
		
		<ui:define name="footer">
			<ui:include src="cjf-extension/footer.xhtml" />
		</ui:define>	
</ui:composition>
