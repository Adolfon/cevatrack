<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="app-template.xhtml">

	<ui:define name="title">
		<title><h:outputText value="#{lbl['cjfTemplate.title']}" /></title>
	</ui:define>

	<ui:define name="content">
		<p:growl />
		<div class="ceva-welcome-page">
			<div class="ceva-panel-welcome-page"></div>
			<div id="welcomePage" class="ceva-text-welcome-page">
				<h3>
				<h:outputText value="#{lbl['listTodo.title']}" />
				</h3>
				<h:form rendered="#{not empty todoController.list}">
					<h:dataTable value="#{todoController.list}" var="todo">
						<h:column>
							<f:facet name="header">ID</f:facet>#{todo.id}</h:column>
						<h:column>
							<f:facet name="header">Title</f:facet>#{todo.title}</h:column>
						<h:column>
							<f:facet name="header">Description</f:facet>#{todo.description}</h:column>
						<h:column>
							<f:facet name="header">Priority</f:facet>#{todo.priority}</h:column>
						<h:column>
							<f:facet name="header">Due Date</f:facet>#{todo.duedate}</h:column>
						<h:column>
							<f:facet name="header">Owner</f:facet>#{todo.owner}</h:column>
						<h:column>
							<h:commandButton value="edit"
								action="#{todoController.edit(todo)}" />
						</h:column>
						<h:column>
							<h:commandButton value="delete"
								action="#{todoController.delete(todo)}" />
						</h:column>
					</h:dataTable>
				</h:form>

				<h:panelGroup rendered="#{empty todoController.list}">
				    <p:outputLabel value="#{lbl['todo.noTodos']}" />
				</h:panelGroup>

				<h:panelGroup rendered="#{!todoController.edit}">
					<h3><h:outputText value="#{lbl['todo.out.addTodo']}" /></h3>
					<h:form>
						<p:outputLabel value="#{lbl['todo.formTitle']}" />
							<p:inputText styleClass="cjf-required"
								value="#{todoController.todo.title}" />
						</p>
						<p:outputLabel value="#{lbl['todo.formDesc']}" />
							<p:inputText value="#{todoController.todo.description}" />
						</p>
						<p:outputLabel value="#{lbl['todo.formPriority']}" />
							<p:inputText value="#{todoController.todo.priority}" />
						</p>
						<p:outputLabel value="#{lbl['todo.formDueDate']}" />
							<p:calendar value="#{todoController.todo.duedate}"
								navigator="true" pattern="MM/dd/yyyy" showOn="button" />
						</p>
						<p>
							<h:commandButton value="#{lbl['gen.btn.add']}" action="#{todoController.add}" />
							<h:commandButton value="#{lbl['gen.btn.reset']}"
								action="#{todoController.resetAdd}" />
						</p>
					</h:form>
				</h:panelGroup>

				<h:panelGroup rendered="#{todoController.edit}">
					<h3><h:outputText value="#{lbl['todo.out.editTodo']}" /> #{todoController.todo.id}</h3>
					<h:form>
						<p:outputLabel value="#{lbl['todo.formTitle']}" />
							<p:inputText value="#{todoController.todo.title}" />
						</p>
						<p:outputLabel value="#{lbl['todo.formDesc']}" />
							<p:inputText value="#{todoController.todo.description}" />
						</p>
						<p:outputLabel value="#{lbl['todo.formPriority']}" />
							<p:inputText value="#{todoController.todo.priority}" />
						</p>
						<p:outputLabel value="#{lbl['todo.formDueDate']}" />
							<p:calendar value="#{todoController.todo.duedate}"
								navigator="true" pattern="MM/dd/yyyy" showOn="button" />
						</p>
						<p>
							<h:commandButton value="#{lbl['gen.btn.save']}" action="#{todoController.saveEdit}" />
							<h:commandButton value="#{lbl['gen.btn.cancel']}"
								action="#{todoController.cancelEdit}" />
						</p>
					</h:form>
				</h:panelGroup>
				<p>
					<a href="index.xhtml">Go back to index</a>
				</p>
			</div>
		</div>
	</ui:define>

</ui:composition>
