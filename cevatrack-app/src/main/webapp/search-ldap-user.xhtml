<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/popup-template.xhtml">
	<f:metadata>
		<f:event listener="#{aAFSecurityBean.checkPermissions}"
			type="preRenderView"></f:event>
		<f:attribute name="permission"
			value="#{CJFPermissionConstants.TODO_VIEW}" />
	</f:metadata>
	<ui:define name="title">
		<title><h:outputText value="#{lbl['ldapSearch.title']}" /></title>
	</ui:define>

	<ui:define name="content">
		<h:form id="frm_searchLDAPUser">
			<p:growl id="growl" showDetail="true" sticky="true" />
			<div class="ceva-welcome-page">
				<div class="ceva-panel-welcome-page"></div>
				<div id="welcomePage" class="ceva-text-welcome-page">

					<h:panelGroup rendered="#{todoController.todo.id == null}">
						<h2 align="center">
						<h:outputText value="#{lbl['ldapSearch.title']}" />
						</h2>
					</h:panelGroup>

					<p:panelGrid columns="3">
						<p:outputLabel for="txt_prefix" value="#{lbl['ldapSearch.userName']}" />
						<p:inputText id="txt_prefix"
							value="#{todoController.searchPrefix}">
						<p:keyFilter regEx="/[a-z0-9]/i"/>

						</p:inputText>

						<p:commandButton id="btn_search" value="#{lbl['gen.btn.search']}"
							actionListener="#{todoController.searchLdapUsers}"
							process="txt_prefix" update="tbl_list_user" />

					</p:panelGrid>


					<p:dataTable id="tbl_list_user" value="#{todoController.ldapUsers}"
						var="ldapUser" align="center"
						paginatorTemplate="{RowsPerPageDropdown} {FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
						rowsPerPageTemplate="#{todoController.pageSizeValues}"
						lazy="false" paginator="true"
						rows="#{todoController.initialPageSize}"
						paginatorPosition="#{todoController.paginatorPosition}"
						sortBy="#{ldapUser['displayName']}" sortOrder="ascending"
						headerClass="todo-table-header"
						rowClasses="todo-table-odd-row,todotable-even-row"
						emptyMessage="#{lbl['ldapSearch.tbl.empty']}">


						<p:column id="clm_name" headerText="#{lbl['ldapSearch.userName']}"
							sortBy="#{ldapUser.displayName}" width="35%">
							<p:commandLink id="ajax"
								actionListener="#{todoController.selectUserFromLdap(ldapUser)}">
								<h:outputText id="out_namel" value="#{ldapUser.displayName}" />
							</p:commandLink>
						</p:column>

						<p:column id="clm_logonName" headerText="#{lbl['ldapSearch.clm.userLogonName']}"
							sortBy="#{ldapUser.accountName}" width="20%">
							<h:outputText id="out_logonName" value="#{ldapUser.accountName}" />
						</p:column>

						<p:column id="clm_email" headerText="#{lbl['ldapSearch.clm.userEmail']}"
							sortBy="#{ldapUser.principalName}">
							<h:outputText id="out_email" value="#{ldapUser.principalName}" />
						</p:column>

						<p:column rendered="false">
							<p:commandButton id="btn_edit" value="#{lbl['gen.btn.edit']}"
								action="#{todoController.edit(ldapUser)}" update="tbl_list_user" />
						</p:column>
					</p:dataTable>

					<p:panelGrid columns="3" styleClass="button">
						<p:commandButton id="btn_reset" value="#{lbl['gen.btn.reset']}"
							actionListener="#{todoController.restSearchLdapUserAction}"
							process="@this" update="@form" />
					</p:panelGrid>


				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
