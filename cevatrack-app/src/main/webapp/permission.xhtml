<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:aaf="http://xmlns.jcp.org/jsf/composite/aaf"
	xmlns:p="http://primefaces.org/ui" template="app-template.xhtml">
	<f:metadata>
		<f:event listener="#{aAFSecurityBean.checkPermissions}" type="preRenderView"></f:event>
		<f:attribute name="permission" value="#{AAFPermissionConstants.PERMISSION_VIEW}" />
	</f:metadata>
	<ui:define name="title">
		<h:outputText value="#{lbl['permissionMaintenance.out.title']}" />
	</ui:define>
	<ui:define name="content">
		<aaf:permission id="aaf_permission"/>
	</ui:define>
</ui:composition>
