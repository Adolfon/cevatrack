<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:aaf="http://xmlns.jcp.org/jsf/composite/aaf" 
	template="cjf-base/template/template.xhtml">
		
	<ui:define name="app-title">
		<span class="app-name"><h:outputText value="#{lbl['gen.application.title']}" /></span>
	</ui:define>
	
	<ui:define name="title">
	    <h:outputText value="#{lbl['cjfTemplate.title']}"/>
	</ui:define>
	
	<ui:define name="stylesheets">		
	    <h:outputStylesheet library="aaf" name="css/aaf.css?#{buildInfoBean.buildTime}"/>
	    <h:outputStylesheet library="css" name="app.css?#{buildInfoBean.buildTime}" />
	    <h:outputStylesheet library="css" name="common.css?#{buildInfoBean.buildTime}" />
	</ui:define>
	
	<ui:define name="custom-functions">
		<p:importConstants type="com.ceva.security.aaf.utils.AAFPermissionConstants" var="AAFPermissionConstants" />
		<p:importConstants type="com.ceva.cevatrack.util.CJFPermissionConstants" var="CJFPermissionConstants" />
	</ui:define>
	
	<ui:define name="signuplink">
		<ui:include src="/cjf-extension/signup.xhtml" />
	</ui:define>
	
	<ui:define name="cjf_template_menubar-items">
		<ui:include src="/cjf-extension/menubar_items.xhtml"/>
	</ui:define>
	
	<!--Configure the AjaxStatus-->
	<!-- <ui:define name="ajaxStatus">
		
	</ui:define> -->

	</ui:define>
