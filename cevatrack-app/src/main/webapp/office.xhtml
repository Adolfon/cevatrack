<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core" 
	template="app-template-fire.xhtml">
		
		<ui:define name="content">
		    <h2>Ceva employees in the office</h2>
		
		    <h:form id="form">          
		    	 <p:growl id="growl" life="3000" />

  				 <p:dataTable id="tableDynamo" var="con"
                        value="#{dynamoViewUpdate.tableFire}"
                        widgetVar="fireTable" rowKey="#{con.id}" filteredValue = "#{dynamoViewUpdate.tableFireFilter}"
                        emptyMessage="There is no people in the office">
                        
						<p:column styleClass="centeredColumn" colspan="2" selectionMode="multiple">
						</p:column>
						
                        <p:column styleClass="centeredColumn" headerText="Id key"
                            colspan="2" sortBy="#{con.id}">
                            <h:outputText style="center;" value="#{con.id}" />
                        </p:column>
                        
                          <p:column filterBy="#{con.cevaLocation}" styleClass="centeredColumn" headerText="CEVA Location"
                            colspan="2" filterMatchMode="exact">
                            <f:facet name="filter">
	                            <p:selectOneMenu onchange="PF('fireTable').filter()">	                        	
	                          		<f:selectItem itemLabel="#{dynamoViewUpdate.defaultLocation}" itemValue="#{dynamoViewUpdate.defaultLocation}" />                       																								
									<f:selectItems value="#{dynamoViewUpdate.cevaLocations}"  />
									<f:selectItem itemLabel="No filter" itemValue="" /> 									
								</p:selectOneMenu>
                            </f:facet>
                            <h:outputText style="center;" value="#{con.cevaLocation}" />
                        </p:column>
                        
                          <p:column styleClass="centeredColumn" headerText="Entry Date"
                            colspan="2" sortBy="#{con.entryDate}">
                            <h:outputText style="center;" value="#{con.entryDate}" />
                        </p:column>
                        
                        <!-- 
                        <p:column styleClass="centeredColumn" headerText="Entry Time"
                            colspan="2" sortBy="#{con.entryTime}">
                            <h:outputText style="center;" value="#{con.entryTime}" />
                        </p:column>
                         -->
                        <p:column filterBy="#{con.fireAssemblyPoint}" styleClass="centeredColumn" headerText="FireAssemblyPoint" 
                            colspan="2" filterMatchMode="exact">
                             <f:facet name="filter">
	                            <p:selectOneMenu onchange="PF('fireTable').filter()">
	                            	<f:selectItem itemLabel="#{dynamoViewUpdate.defaultPoint}" itemValue="#{dynamoViewUpdate.defaultPoint}" />	                        		                          		                      																								
									<f:selectItems value="#{dynamoViewUpdate.fireAssemblyElements}"  />
									<f:selectItem itemLabel="No filter" itemValue="" />  
								</p:selectOneMenu>
                            </f:facet>
                        	<h:outputText style="center;" value="#{con.fireAssemblyPoint}" />
                        </p:column>
                        
                        
                        <p:column styleClass="centeredColumn" headerText="Is appointment?"
                            colspan="2" sortBy="#{con.isAppointment}">
                            <h:outputText style="center;" value="#{con.isAppointment}" />
                        </p:column>
                        <p:column styleClass="centeredColumn" headerText="First Name"
                            colspan="2" sortBy="#{con.empFirstName}">
                            <h:outputText style="center;" value="#{con.empFirstName}" />
                        </p:column>
                        <p:column styleClass="centeredColumn" headerText="Last Name"
                            colspan="2" sortBy="#{con.empLastTime}">
                            <h:outputText style="center;" value="#{con.empLastTime}" />
                        </p:column>
                        <p:column styleClass="centeredColumn" headerText="Fire group"
                            colspan="2" sortBy="#{con.fireGroup}">
                            <h:outputText style="center;" value="#{con.fireGroup}" />
                        </p:column>
                        
                        
                        
					</p:dataTable>
					
					<div style = "padding-top:1%; text-align:center; width:100% ">
															        
					</div>
			        
					
			</h:form>	
		
		
		</ui:define>
		
		<ui:define name="footer">
			<ui:include src="cjf-extension/footer.xhtml" />
		</ui:define>	
</ui:composition>
