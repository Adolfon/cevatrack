<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core" 
	template="app-template.xhtml">
		
		<ui:define name="content">
		    <h2>Ceva employees in the office</h2>
		
		    <h:form id="form">          
		    	 <p:growl id="growl" life="3000" />
		            

                    <p:dataTable id="tableDynamo" var="con"
                        value="#{dynamoView.tableFire}"
                        widgetVar="consignmentsTable" multiViewState="true"
                        rowKey="#{con.id}">
 
						<p:column styleClass="centeredColumn" colspan="2" selectionMode="multiple">
						</p:column>
						
                        <p:column styleClass="centeredColumn" headerText="Id key"
                            colspan="2" sortBy="#{con.id}">
                            <h:outputText style="center;" value="#{con.id}" />
                        </p:column>
                        
                          <p:column styleClass="centeredColumn" headerText="Employee ID"
                            colspan="2">
                            <h:outputText style="center;" value="#{con.employeeId}" />
                        </p:column>
                        
                          <p:column styleClass="centeredColumn" headerText="Entry time"
                            colspan="2" sortBy="#{con.entryTime}">
                            <h:outputText style="center;" value="#{con.entryTime}" />
                        </p:column>
					</p:dataTable>
					
					<div style = "padding-top:1%; text-align:center; width:100% ">
					
						<h:panelGrid columns="2" style="margin-bottom:1%;position:center; width:100%" cellpadding="5" >
					        
					        <p:selectOneButton value="#{dynamoView.option}" onchange="$('comButton').attr('disabled',false)">
					            <f:selectItem itemLabel="Check in" itemValue="ChkIN" style= "margin-right: 1%" />
					            <f:selectItem itemLabel="Check out" itemValue="ChkOUT" />			            
				        	</p:selectOneButton>
				        	
				        </h:panelGrid>
				        	
			        	
			        	
			        	   
						      <!-- <p:inputText id="float-input" value="#{basicView.text}" /> --> 
						      <p:outputLabel for="@previous" value="Employee ID number: " style="margin-right:1%;"/>
						      <p:inputNumber id="inputText" value="#{dynamoView.inputText}" decimalPlaces="0" style="margin-right:1%;" />
						      
					
			         
				        <p:commandButton id="comButton" value="Submit" action="#{dynamoView.buttonAction}" update="tableDynamo,growl" icon="pi pi-check" style="margin-right:1%;"/>
				        <!-- <p:commandButton value="Ajax Submit" id="ajax" update="growl" action="#{buttonView.buttonAction}" style="margin-right:20px;" styleClass="ui-priority-primary" /> -->
				        <p:spacer />
				        
					</div>
			        
					
			</h:form>	
		
		
		</ui:define>
		
		<ui:define name="footer">
			<ui:include src="cjf-extension/footer.xhtml" />
		</ui:define>	
</ui:composition>
