<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">
			<p:fieldset legend="User Preferences" style="text-align:left">
		<p:panelGrid id="pgd_user_preferences"
			columns="#{cc.attrs.isDialog eq 'true' ? 2 : 4}" layout="grid"
			columnClasses="#{cc.attrs.isDialog eq 'true' ? 'ui-xl-3 ui-lg-3 ui-md-3 ui-sm-12,ui-g-3 ui-sm-12, ui-xl-3 ui-lg-3 ui-md-3 ui-sm-12,ui-g-3 ui-sm-12' 
			: 'ui-g-1, ui-xl-2 ui-lg-2 ui-md-2 ui-sm-12,ui-g-3 ui-sm-12,ui-g-1, ui-xl-2 ui-lg-2 ui-md-2 ui-sm-12,ui-g-3 ui-sm-12'}"
			styleClass="ui-noborder">
			<p:spacer rendered="#{cc.attrs.isDialog ne 'true'}" />
			<h:panelGroup>
				<p:outputLabel for="ckb_enableTodoNotification"
					value="Enable Todo Notification" />
				<p:outputLabel id="lbl_enableTodoNotification">
					<i class="fa fa-question-circle"></i>
				</p:outputLabel>
				<p:tooltip for="lbl_enableTodoNotification"
					value="Enable Todo Notification"
					id="tltp_enableTodoNotification" />
			</h:panelGroup>
			<p:selectBooleanCheckbox value="#{appUserProfileBean.enableTodoNotification}"
				id="ckb_enableTodoNotification" />
		</p:panelGrid>
		</p:fieldset>
</ui:composition>
