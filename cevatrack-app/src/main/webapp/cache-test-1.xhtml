<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="cjf-base/template.xhtml">
	
	<ui:define name="title">
	    <title><h:outputText value="CJF-TEMPLATE"/></title>
	</ui:define>
	
	<ui:define name="content">
		<p:growl/>
		<div class="ceva-welcome-page">		
			<div class="ceva-panel-welcome-page">				
			</div>			
   			<div id="welcomePage" class="ceva-text-welcome-page">
   				<h2>
   				<h:outputText value="#{lbl['cache.out.welcome']}" />
   				</h2>
   				<h:form>
   					<p:outputLabel for="name" value="#{lbl['cache.name']} "/>
   					<p:inputText id="name" value="#{homeBean.name}"></p:inputText>   					
   					<br/><br/>
   					<p:outputLabel for="button" value="#{lbl['cache.date']} "/>
   					<p:calendar id="button" value="#{date}" showOn="button"/>
   					<br/><br/>
   					<p:commandButton value="#{lbl['cache.btn.welcome']}" action="cache-test-2"></p:commandButton>
   				</h:form>
   			</div>
		</div>
	</ui:define>
	
	<ui:define name="footer">
		<ui:include src="cjf-extension/footer.xhtml"/>
	</ui:define>
	
</ui:composition>
