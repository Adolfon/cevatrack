<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:aaf="http://java.sun.com/jsf/composite/aaf"	
	xmlns:shiro="http://shiro.apache.org/tags"		
	template="app-template.xhtml">
   
   	<!-- 
   	<ui:define name="stylesheets">
		<h:outputStylesheet library="css" name="smartNet.css?#{buildInfoBean.buildTime}" /> 
    </ui:define>   -->
   
	<ui:define name="content">
		<p:growl />
		<shiro:authenticated>
		<h:panelGroup styleClass="ceva-welcome-page">
			<h:panelGroup layout="block" id="welcomePage"
				styleClass="ceva-text-welcome-page">
				<h:form id="form">
					<h:panelGroup layout="block" styleClass="ui-g" style="margin-top:10px;">
						<h:panelGroup layout="block" styleClass="d-sm-none ui-md-3 d-lg-2">
						</h:panelGroup>
						<h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6 d-lg-8">
							<h1 id="title" style="text-align: center"><h:outputText value="#{dtClientView.network}" /></h1>
						</h:panelGroup>
						<h:panelGroup layout="block" styleClass="ui-g-12 ui-md-3 d-lg-2" style="align-self:center;">
							<p:calendar id="datesel" styleClass="datepicker h5"
								value="#{dtClientView.reportDate}"
								mindate="#{dtClientView.minDate}"
								maxdate="#{dtClientView.maxDate}" pattern="dd MMM yyyy"
								locale="en_GB" readonlyInput="true">
								<p:ajax event="dateSelect"
									listener="#{dtClientView.onDateSelect}" update="clientgrid,datesel,dateselTo" />
							</p:calendar> -- To -- 
							<p:calendar id="dateselTo" styleClass="datepicker h5"
								value="#{dtClientView.reportDateTo}"	
								mindate="#{dtClientView.reportDate}"
								maxdate="#{dtClientView.maxDateTo}" pattern="dd MMM yyyy"							
								locale="en_GB" readonlyInput="true">
								<p:ajax event="dateSelect"
									listener="#{dtClientView.onDateSelectTo}"
									update="clientgrid,datesel,dateselTo" />
							</p:calendar>
						</h:panelGroup>
					</h:panelGroup>
					<div id="sn-save">
						<h:panelGroup layout="block" styleClass="ui-g" id="clientgrid">
						
						<c:choose>
						<c:when test="${empty dtClientView.sclients}">
							<tr><td colspan="6">No data available, try another date or refresh the page...</td></tr>
						</c:when>

						<c:otherwise>						
							<c:forEach items="#{dtClientView.sclients.values()}" var="client">
								<ui:fragment rendered="#{dtClientView.sclients.size() &lt; 3}">
									<h:panelGroup layout="block"
										styleClass="ui-g-2 ui-md-2 ui-lg-4">
									</h:panelGroup>
								</ui:fragment>
								<ui:fragment rendered="#{dtClientView.sclients.size() &gt;= 3}">
									<h:panelGroup layout="block"
										styleClass="ui-g-2 ui-md-2 d-lg-none">
									</h:panelGroup>
								</ui:fragment>
								<h:panelGroup layout="block" styleClass="ui-g-8 ui-md-8 ui-lg-4">									
										<h:panelGroup layout="block"
											styleClass="panel panel-#{dtClientView.getClientCssClass(client.clientConfig.name)}">
											<h:panelGroup layout="block" styleClass="panel-heading">
												<h:link outcome="consignmentSnView.xhtml">
													<f:param name="network" value="#{dtClientView.network}" />
													<f:param name="site" value="z0" />
													<f:param name="client" value="#{client.clientConfig.name}" />
													<f:param name="prefix" value="#{client.clientConfig.prefixes}" />
													<f:param name="reportdate" value="#{dtClientView.reportDateString}" />
													<f:param name="reportdateTo" value="#{dtClientView.reportDateStringTo}" />
								                	#{client.clientConfig.name}
								                </h:link> 
								              </h:panelGroup>				                 
				              <h:panelGroup layout="block" styleClass="panel-body">
				                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6 ui-lg-6">
					                <h:panelGroup layout="block" styleClass="panel">
					                  <h:panelGroup layout="block" styleClass="panel-body">
					                  	<h:link outcome="consignmentSnView.xhtml">
					                  	<f:param name="network" value="#{dtClientView.network}" />
					                  	<f:param name="site" value="z0" />
										<f:param name="client" value="#{client.clientConfig.name}" />
										<f:param name="reportdate" value="#{dtClientView.reportDateString}" />
										<f:param name="reportdateTo" value="#{dtClientView.reportDateStringTo}" />
						                  <p:graphicImage class="signatureimg" library="images" name="#{client.clientConfig.image}" />
						                 </h:link>
						                </h:panelGroup>
						              </h:panelGroup>
					              </h:panelGroup>
				                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-6 ui-lg-6">
		                      <h:panelGroup layout="block" styleClass="panel">
		                        <h:panelGroup layout="block" styleClass="panel-body">
							                <h:panelGroup layout="block" styleClass="ui-g-12 ui-md-8 ui-lg-9">
							                  <table class="table">
							                    <tbody >
							                    <ui:fragment rendered="#{ empty client.statusCounts}">
							                    	<p> There are no consignments </p>
							                    </ui:fragment>
			                              <c:forEach items="#{client.statusCounts}" var="entry">			                              		                               			                               		
					                              <tr class="#{dtClientView.getStatusCssClass(entry.key)}">   					                              						                              	
						                                <td>
							                                <h:link outcome="consignmentSnView.xhtml">
							                                	<f:param name="network" value="#{dtClientView.network}" />
							                                	<f:param name="site" value="z0" />
																<f:param name="client" value="#{client.clientConfig.name}" />
																<f:param name="reportdate" value="#{dtClientView.reportDateString}" />
																<f:param name="reportdateTo" value="#{dtClientView.reportDateStringTo}" />
							                              		<f:param name="initstatus" value="#{dtClientView.getStatusDescription(entry.key)}"/>								                               
								                                  #{dtClientView.getStatusDescription(entry.key)}
								                            </h:link>						                                 
					                                  </td>
					                                  <td>
						                                  <h:link outcome="consignmentSnView.xhtml">
						                                  	<f:param name="network" value="#{dtClientView.network}" />
						                                  	<f:param name="site" value="z0" />
															<f:param name="client" value="#{client.clientConfig.name}" />
															<f:param name="reportdate" value="#{dtClientView.reportDateString}" />
															<f:param name="reportdateTo" value="#{dtClientView.reportDateStringTo}" />
						                              		<f:param name="initstatus" value="#{dtClientView.getStatusDescription(entry.key)}"/>
				                                        	#{entry.value}
				                                           </h:link>					                                    
					                                  </td>				                                 
				                                </tr>
			                              </c:forEach>
								                  </tbody>
							                  </table>
							                </h:panelGroup>
							              </h:panelGroup>
							            </h:panelGroup>
				                </h:panelGroup>
				              </h:panelGroup>
				            </h:panelGroup> 			              
		            </h:panelGroup>      		            
	              <ui:fragment rendered="#{dtClientView.sclients.size() &lt; 3}">
	                <h:panelGroup layout="block" styleClass="ui-g-2 ui-md-2 ui-lg-4">
	                </h:panelGroup>
	              </ui:fragment>
	              <ui:fragment rendered="#{dtClientView.sclients.size() &gt;= 3}">
	                <h:panelGroup layout="block" styleClass="ui-g-2 ui-md-2 d-lg-none">
	                </h:panelGroup>
	              </ui:fragment>
			        </c:forEach>
			    </c:otherwise>
             </c:choose>
			</h:panelGroup>
          </div>
		</h:form>

			</h:panelGroup>
		</h:panelGroup>
		</shiro:authenticated>
	</ui:define>

	<ui:define name="footer">
	  <shiro:authenticated>
		<!-- <ui:fragment rendered="#{!neverExpires}">
			<aaf:sessionmonitor id="sessionMonitor" />
		</ui:fragment>  -->		
		<ui:include src="cjf-extension/footer.xhtml" />
		<h:outputScript library="javax.faces" name="jsf.js" />
		<h:outputScript library="js" name="app-ajax.js" />
		<h:outputScript library="js" name="app-script-1.js" />
		<h:outputScript library="js" name="sn-clients.js" />
	  </shiro:authenticated>
	</ui:define>
  
</ui:composition>
