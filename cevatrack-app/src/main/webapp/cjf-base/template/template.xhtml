<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:aaf="http://security.ceva.com/jsf/aaf/tags"
	xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions" lang="en">
<f:view locale="#{localeController.locale}">

	<h:head>
		<f:facet name="first">
			<meta http-equiv="X-UA-Compatible" content="IE=edge" />
			<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
			<meta name="viewport"
				content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
			<meta name="apple-mobile-web-app-capable" content="yes" />
		</f:facet>
		<ui:insert name="title">You can control the page title runtime</ui:insert>
		<h:outputScript name="js/nanoscroller.js?#{buildInfoBean.buildTime}"
			library="harmony-layout" />
		<h:outputScript name="js/layout.js?#{buildInfoBean.buildTime}"
			library="harmony-layout" />
		<ui:insert name="head" />

		<h:outputStylesheet library="cjf-base"
			name="css/style.css?#{buildInfoBean.buildTime}" />
		<ui:insert name="stylesheets" />
	</h:head>

	<h:body>

		<ui:insert name="custom-functions" />

		<div class="layout-wrapper #{userPreferences.menuMode} layout-ltr">
			<ui:decorate template="topbar.xhtml" />
			<ui:decorate template="right_panel.xhtml" />
			<ui:decorate template="sidebar.xhtml" />

			<div class="layout-main"
				style="position: absolute; top: 64px; bottom: 36px; left: 0px; right: 0px; overflow: auto;">

				<div class="layout-content">
					<ui:insert name="content"></ui:insert>
					<ui:insert name="ajaxStatus">
						<p:ajaxStatus onstart="PF('statusDialog').show()"
							onsuccess="PF('statusDialog').hide()" />

						<p:dialog id="dlg_ajaxStatusDialog" widgetVar="statusDialog"
							modal="false" draggable="false" closable="false"
							resizable="false" showHeader="false">
							<i class="fa fa-2x fa fa-circle-o-notch fa-spin ajax-status-icon"
								aria-hidden="true"></i>
						</p:dialog>
					</ui:insert>

				</div>

				<div class="layout-mask"></div>
			</div>

			<ui:insert name="footer">
				<ui:include src="footer.xhtml" />
			</ui:insert>
		</div>
		<h:outputStylesheet
			name="css/nanoscroller.css?#{buildInfoBean.buildTime}"
			library="harmony-layout" />
		<h:outputStylesheet
			name="css/layout-#{userPreferences.layout}.css?#{buildInfoBean.buildTime}"
			library="harmony-layout" />
		<ui:fragment
			rendered="#{environmentInfoBean.isAnalyticsTrackingCodeExists()}">
			<h:inputHidden id="inh_analyticsTrackingCode"
				value="#{environmentInfoBean.analyticsTrackingCode}" />
			<!-- Global site tag (gtag.js) - Google Analytics -->
			<!-- TODO Make this configurable - only add analytics script if enabled -->
			<script async="async" src="https://www.googletagmanager.com/gtag/js" />
			<h:outputScript name="js/googleAnalytics.js" library="cjf-base" />
		</ui:fragment>

		<ui:fragment rendered="#{environmentInfoBean.isMatomoEnabled()}">
			<h:inputHidden id="inh_matomoSiteId"
				value="#{environmentInfoBean.matomoSiteId}" />
			<h:inputHidden id="inh_matomoWebsite"
				value="#{environmentInfoBean.matomoWebsite}" />
			<h:outputScript name="js/matomo.js" library="cjf-base" />
		</ui:fragment>
		<ui:insert name="bottomContent">
		</ui:insert>
	</h:body>
</f:view>
</html>
