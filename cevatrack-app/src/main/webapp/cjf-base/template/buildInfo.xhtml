<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" >
	
	<p:dialog header="#{cjfBaseLbls['buildInfo.dlg.header']}"
		id="buildInfo" widgetVar="BuildInfoDlgVar"
		modal="true" closable="true" fitViewport="true" appendTo="@(body)"
		width="380" draggable="true" responsive="true" resizable="true">
		<h:form id="frm_buildInfoForm" >

			<p:panelGrid columns="3" layout="grid" columnClasses="ui-g-6 setTextBold,ui-g-1,ui-g-5">
					<h:outputText value="#{cjfBaseLbls['buildInfo.version']}"/>
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_version" value="#{buildInfoBean.version}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.buildNumber']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_deploymentBuildNumber" value="#{buildInfoBean.deploymentBuildNumber}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.sourceBuild']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_sourceBuildNumber" value="#{buildInfoBean.sourceBuildNumber}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.pomVersion']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_pomVersion" value="#{buildInfoBean.pomVersion}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.builtBy']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_builtBy" value="#{buildInfoBean.builtBy}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.buildTime']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_buildTime" value="#{buildInfoBean.buildTime}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.wrapperBuildNumber']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_wrapperBuildNumber" value="#{buildInfoBean.wrapperBuildNumber}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.createdBy']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_createdBy" value="#{buildInfoBean.createdBy}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.buildJdk']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_buildJdk" value="#{buildInfoBean.buildJdk}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.manifestVersion']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_manifestVersion" value="#{buildInfoBean.manifestVersion}" />
					
					<h:outputText value="#{cjfBaseLbls['buildInfo.gitCommit']}" />
					<h:outputText value="#{cjfBaseLbls['buildInfo.separator']}"/>
					<h:outputText id="out_gitCommit" value="#{buildInfoBean.gitCommit}" />	
					
			</p:panelGrid>

		</h:form>
	</p:dialog>
</ui:composition>
