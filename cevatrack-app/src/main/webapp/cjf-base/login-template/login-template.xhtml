<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:aaff="http://security.ceva.com/jsf/aaf/tags"
	xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions" lang="en">
<h:head>
	<f:facet name="first">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
	</f:facet>
	<link rel="shortcut icon" type="image/x-icon" href="#{resource['images/favicon.ico']}"/>
	<title><h:outputText value="CEVATRACK"/></title>
	<h:outputStylesheet library="cjf-base"
		name="css/login.css?#{buildInfoBean.buildTime}" />
	<h:outputStylesheet library="css" name="login.css?#{buildInfoBean.buildTime}" />	
	<link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet" />
	<ui:insert name="stylesheets" />
</h:head>
<h:body styleClass="login-body">
	<script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
	<script
		src="https://rawgit.com/Baedda/floating-form-labels/master/dist/floatingFormLabels.min.js"></script>
	<script>
		$(document).ready(function() {
			$('.ffl-wrapper').floatingFormLabels();
		});
	</script>

	<!-- problem to access image from css file -->
	
	<!-- It is not valid to add inline css in xhtml but we are unable to get background image because this image available in base project and we are using in cjf-Template   -->
	<div id="page" class="login-bg-container">

		
		<div id="header" class="login-header">
			<ui:insert name="header">
				<ui:include src="header.xhtml" />
			</ui:insert>
		</div>
		<div id="content">
			<ui:insert name="content" />
		</div>
	</div>
</h:body>
</html>
