######################################################
# This file contains the global environment specific configuration.
# 
# Runtime path to this file is defined in system.properties during deployment:
# 
###################################################### 

#The environment in which the application is currently running.
application.environment=LOCAL

#Allows environment name to be displayed on application header.
header.show.environment.name=YES

#LDAP Integration
ldap.authentication.enabled=true
ldap.provider.url=ldap://ad.fifthlayer.net:3268
ldap.base.context=OU=People and Contacts,OU=FifthLayer Hosting Company,dc=win,dc=fifthlayer,dc=net
ldap.system.principal=ldapsearch@win.fifthlayer.net
ldap.system.password=duco534

#Configuration to send email to outlook.
email.smtp.host=support.fifthlayer.net
email.from.address=noreply@fifthlayer.net

#By enabling this parameter to true, we can debug the application while sending email and have complete email contents written to the log.
#Refer https://javaee.github.io/javamail/FAQ#debug for more information.
email.debug=false

#configurations for the account expiration email notification.
aaf.contactus.support.address=${cjf-template.my.email}
aaf.account.expiration.mail.content=Dear {0} {1},\n\nYour account will be expired in {2} days. Please contact support.\n\nKind regards,\n{3}.\n\nPlease do not reply to this email as the address is unattended.
aaf.account.expiration.mail.subject=Account expiration {0}
aaf.account.expiration.warning.before.days.1=7
aaf.account.expiration.warning.before.days.2=1
aaf.internal.email.extension=@cevalogistics

#configurations for the email notification.
aaf.user.creation.support.address=${cjf-template.my.email}
aaf.user.creation.mail.subject=User Account created for : {0} {1}, in {2}
aaf.user.forgot.password.mail.subject=Password reset for : {0} {1}, in {2}

#Google Analytics allows to get analytics about your application. Register for google analytics on their website, request a code and place it here so as to start using this feature.
#Google Analytics Tracking Code.
analytics.google.trackingCode=

#Matomo is web analytics application same as google analytics. It allows to get analytics about your application.
#To enable Matomo, set the property to true.
matomo.enabled=true

#property to set Matomo site id
matomo.site.id=1

#property to set websocket url
websocket.url=wss://${virtual-hostname}:8443/cjf-template

#To expose any directory via file navigator. Separate them using ;
file.navigator.directories=git/virtualTomEE/virtualTomEE/tomee/logs;git/virtualTomEE/virtualTomEE/tomee/temp